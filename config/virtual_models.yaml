  safe-coding:
    description: PII-scrubbed coding chain. Every request is forwarded through the
      local PrivAiTe proxy (localhost:8400) to untrusted aggregator upstreams only,
      so secrets/PII are redacted before reaching 3rd-party LLM aggregators. Complements
      coding-elite/coding-fast (which use direct trusted providers and skip scrubbing).
    fallback_chain:
    - provider: privaite
      model: claude-opus-4-8
      priority: 1
