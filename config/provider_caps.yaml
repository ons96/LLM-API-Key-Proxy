# Per-provider capability caps used by the context-size pre-filter in
# router_core.py (_load_provider_caps). Provider-keyed (not model-keyed):
# max_context_tokens = LARGEST context window the provider family can host.
#
# Phase 2.A (2026-08-04): expanded 18 -> 38 providers (all from
# router_config.yaml), corrected values that were falsely low (nvidia was
# 8192 but NIM hosts 131072+; gemini was 32768 but 2.5 Pro is 2M; several
# NewAPI relays were 8192 but host 128K+).
#
# rpm_limit / tpm_limit = 0 means "unknown, no enforcement" (YAGNI until we
# have real per-provider numbers from telemetry).

# --- Direct first-party APIs ------------------------------------------------
