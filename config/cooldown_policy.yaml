# Per-provider 429 wait-vs-fallback policy (#218)
#
# Providers with prompt caching on free-credit tiers benefit from waiting
# out rate limits (preserves cache, avoids re-compute on a fresh provider).
# Default: rotate immediately (current behavior).
#
# wait_on_429: true  -> current request waits retry_after (capped at max_wait_s), retries same provider
# wait_on_429: false -> current request rotates to next provider immediately (legacy behavior)
#
# Eligibility (all must be true): (1) supports prompt caching, (2) free-credit tier (not unlimited-free, not paid),
# (3) cache benefit meaningful (>=20% speedup OR >=20% price discount).
#
# Quota classes (#1069): scalable replacement for hand-adding relays. Tag a
# provider with `quota_class` + `supports_cache` and the wait-vs-fallback
# decision is derived from the `quota_classes` table below. Explicit
# wait_on_429/max_wait_s on a provider always win (back-compat layer).
# Unknown or missing quota_class -> `default` (current behavior).
#
# Class mapping (keep #218 as the reference policy):
#   unlimited  unlimited-free: no credit or cache to preserve, only TTFT
#              matters -> prefer the faster fallback (no wait).
#   credit     free-credit tier: waiting out a 429 preserves credit and warm
#              cache (#218 eligibility) -> short wait, cache required.
#   trial      trial credits: same rationale as credit, shorter cap.
#   paid       never burn paid quota on waits -> rotate immediately.

quota_classes:
  unlimited:
    wait_on_429: false
    max_wait_s: 0
    require_cache: false
    reason: unlimited-prefer-fallback
  credit:
    wait_on_429: true
    max_wait_s: 300
    require_cache: true
    reason: credit-cache-preserve
  trial:
    wait_on_429: true
    max_wait_s: 120
    require_cache: true
    reason: trial-credit-preserve
  paid:
    wait_on_429: false
    max_wait_s: 0
    require_cache: false
    reason: paid-rotate

providers:
  anthropic:
    quota_class: credit
    supports_cache: true
    wait_on_429: true
    max_wait_s: 300
    reason: prompt-cache-discount
  openai:
    quota_class: credit
    supports_cache: true
    wait_on_429: true
    max_wait_s: 120
    reason: implicit-cache
  gemini:
    quota_class: credit
    supports_cache: true
    wait_on_429: true
    max_wait_s: 60
    reason: implicit-cache-free-tier

# Relay entries (#1068): short-wait on 429 for free relays actually in use.
# Rationale differs from #218 cache-credit rule: these relays are
# unlimited-free (no cache discount to preserve), but a short Retry-After
# wait still beats jumping to a weaker chain link. Cap is small (30s) so a
# long Retry-After falls back immediately via existing cap logic.
# kiosapi/nusapi/siliconflow/logfare from #1068 context are NOT gateway
# provider keys (absent from router_config.yaml) — skipped, not added.
  crowllm:
    quota_class: unlimited
    supports_cache: false
    wait_on_429: true
    max_wait_s: 30
    reason: relay-short-retry-after
  freetheai:
    quota_class: unlimited
    supports_cache: false
    wait_on_429: true
    max_wait_s: 30
    reason: relay-short-retry-after
  nvidia:
    quota_class: unlimited
    supports_cache: false
    wait_on_429: true
    max_wait_s: 30
    reason: relay-short-retry-after
  pooled:
    quota_class: unlimited
    supports_cache: false
    wait_on_429: true
    max_wait_s: 30
    reason: relay-short-retry-after
  tokenrouter:
    quota_class: unlimited
    supports_cache: false
    wait_on_429: true
    max_wait_s: 30
    reason: relay-short-retry-after
  kilo:
    quota_class: unlimited
    supports_cache: false
    wait_on_429: true
    max_wait_s: 30
    reason: relay-short-retry-after
  larprouter:
    quota_class: unlimited
    supports_cache: false
    wait_on_429: true
    max_wait_s: 30
    reason: relay-short-retry-after

default:
  wait_on_429: false
  max_wait_s: 0
