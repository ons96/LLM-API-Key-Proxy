name: Deploy to Oracle Cloud

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Secrets cannot be used in a job-level `if:`, so surface them as env and test
    # that. Without ORACLE_HOST the image still builds and pushes, and the deploy
    # step is skipped with a notice instead of failing the whole workflow.
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USERNAME: ${{ secrets.ORACLE_USERNAME }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
    steps:
      - name: Deploy skipped (no credentials configured)
        if: env.ORACLE_HOST == ''
        run: |
          echo "::notice title=Deploy skipped::ORACLE_HOST/ORACLE_USERNAME/ORACLE_SSH_KEY are not set."
          echo "The image was built and pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}; nothing was deployed."

      - name: Deploy to Oracle Cloud VPS
        if: env.ORACLE_HOST != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ env.ORACLE_HOST }}
          username: ${{ env.ORACLE_USERNAME }}
          key: ${{ env.ORACLE_SSH_KEY }}
          script: |
            # Login to registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull new image
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest
            
            # Stop and remove existing container
            docker stop llm-proxy || true
            docker rm llm-proxy || true
            
            # Run new container
            # Map port 3000 to 8000 (Host Port 3000 -> Container Port 8000)
            docker run -d \
              --name llm-proxy \
              --restart always \
              -p 3000:8000 \
              ghcr.io/${{ env.IMAGE_NAME }}:latest
