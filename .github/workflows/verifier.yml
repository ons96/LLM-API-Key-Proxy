name: Verifier

# The verifier is the authority for "does this change pass?" (#1422). Its exit
# code is the sole pass criterion. Protected paths (see .github/CODEOWNERS)
# additionally require a human approving review, so the loop can never rewrite
# the evaluator or its tests and merge the change on its own.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      SKIP_LAUNCHER: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run verifier
        run: python scripts/verify.py

  protected-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require human review for protected paths
        run: python scripts/check_protected_paths.py
        env:
          GH_TOKEN: ${{ github.token }}
