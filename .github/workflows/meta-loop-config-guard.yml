name: Meta-loop Config Surface Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard-config-surface:
    name: Guard meta-loop config surface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run config surface guard (push)
        if: github.event_name == 'push'
        uses: ./.github/actions/config-surface-guard
        with:
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}

      - name: Run config surface guard (pull_request)
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/config-surface-guard
        with:
          base: origin/main
          head: ${{ github.event.pull_request.head.sha }}