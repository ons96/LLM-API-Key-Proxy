name: Code Scanning (CodeQL)

# Trial gate for ons96/task-board#854 ("trial free-tier dev tools, adopt if
# signal > noise").
#
# CodeQL is the only candidate that needs no third-party account: code scanning
# is free on public repositories, the SARIF upload uses the workflow's own
# GITHUB_TOKEN, and the only scope involved is the job-level
# `security-events: write` below. No GitHub App install, no OAuth consent, no
# vendor that can read this repository.
#
# `security-extended`, not `security-and-quality`. The trial started on the
# wider pack to see what it produced, and the first full-tree scan on main
# answered that immediately: 428 alerts, 365 of them unrated quality findings
# (166 unused imports, 88 empty excepts, 43 unused locals). That volume cannot
# be triaged and would bury the findings that matter for a proxy holding
# provider keys (36 clear-text-logging-sensitive-data, 10 weak hashing).
# Dropping the quality queries is the change the trial's own data asked for.

on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/codeql.yml"
  schedule:
    # Weekly full-tree sweep: only a scheduled run covers code that no PR
    # touches, which is where stale findings accumulate.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      # Required to upload SARIF to the code scanning API. Nothing is written
      # back to the repository.
      security-events: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Initialize CodeQL
        # v4, not v3: v3 is deprecated in December 2026 and a gate scheduled to
        # expire a month into a two-week trial is not worth installing.
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934  # v4
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934  # v4
        with:
          category: "/language:python"
