name: Routing tests

# The failover path had no automation at all: 25 workflows, none ran pytest, so
# a change that broke 429 fallthrough would ship green. This job covers the
# routing/failover core only. The rest of the suite needs local state (benchmark
# DB, telemetry paths) and three tests are currently red for environment reasons,
# so running everything here would be a gate that is red on day one:
#   tests/test_financial_safety.py::test_s06_fresh_import_and_evaluation_have_no_side_effects
#   tests/test_rank_models.py::TestLoadersGraceful::test_load_benchmark_real_db_if_present
#   tests/test_router_core.py::TestErrorClassification::test_apply_rate_limit_cooldown
# tests/test_financial_test_isolation.py is excluded on purpose: it refuses to
# run under pytest and demands `python -I -S tests/support/financial_test_bootstrap.py`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Imports are written as `src.proxy_app...`, so the repo root must be on
      # the path; tests/conftest.py only adds `src/`, which is not enough.
      PYTHONPATH: .
      SKIP_LAUNCHER: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Routing and failover tests
        run: |
          pytest -q \
            tests/test_fault_injection.py \
            tests/test_fallback_logic.py \
            tests/test_chain_selector.py \
            tests/test_chain_policy.py \
            tests/test_free_only_mode.py \
            tests/test_configuration.py \
            tests/test_cooldown_policy.py
